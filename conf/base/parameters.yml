# =====================================================================
# Pipeline parameters
#
# Every number that encodes a business assumption lives here rather than in
# code, so that the assumptions can be reviewed and changed by someone who
# does not read Python.
# =====================================================================

integrity:
  # Thresholds are per-check because the two checks measure at different
  # grains, and a single global number is therefore wrong for at least one.
  #
  # Reviews are checked one document per row, so the observed rate is the
  # injected rate: ~5%.
  #
  # Sessions are aggregated to one row per customer in MongoDB *before* the
  # check sees them. 236k valid session documents collapse into ~98k real
  # customers, but each orphaned session carries its own unique dangling
  # customer id and collapses into nothing. The same 5% document-level
  # breakage therefore presents as ~11% at customer grain. This is a property
  # of the aggregation, not a worse data-quality problem -- but it has to be
  # written down, because the alternative is quietly widening the threshold
  # until the check stops complaining.
  checks:
    reviews:
      # Ceiling: above this, breakage is bad enough that downstream figures
      # would be misleading, so the run stops.
      max_orphan_rate: 0.10
      # Floor: this fixture injects orphans on purpose. Finding materially
      # fewer means the check is broken, not that the data is clean.
      min_orphan_rate: 0.01
    sessions:
      max_orphan_rate: 0.15
      min_orphan_rate: 0.02

scale:
  # Carrier scan events generated per order line. Real parcel-tracking feeds
  # emit one row per handling event; exploding ~112k order lines at this rate
  # produces the several-million-row flat file the Spark layer exists for.
  min_scans_per_line: 8
  max_scans_per_line: 42
  seed: 42

forecasting:
  # Weekly grain: daily demand at category level is too sparse to model, and
  # monthly is too coarse for a reorder decision.
  frequency: W-MON
  horizon_weeks: 8
  # Walk-forward validation. Each fold trains on everything before a cut-off
  # and tests on the following `horizon_weeks`, then the cut-off advances.
  # A random split would let the model see future weeks while predicting past
  # ones, which inflates every metric and is worthless for a forecast.
  n_folds: 5
  min_train_weeks: 52
  lags: [1, 2, 3, 4, 8, 12, 52]
  rolling_windows: [4, 8, 12]
  # Categories below this weekly average are too sparse to forecast honestly;
  # they are reported separately rather than modelled.
  min_weekly_units: 3.0

  model:
    # One model across all horizons, with `horizon` as a feature, rather than
    # one model per horizon. Pooling gives each fit eight times the training
    # rows, which matters a great deal at this data size: separate per-horizon
    # models overfit badly enough to lose to a naive baseline.
    pooled_horizons: true
    # Absolute error, because the reported metric (WAPE) is an L1 measure.
    # Training on squared error optimises something the scorecard does not use.
    loss: absolute_error
    # Deliberately heavy regularisation. With ~100 weeks of history the useful
    # signal is shallow, and depth/leaf were the levers that moved this model
    # from losing to the naive baseline to beating it.
    max_depth: 4
    min_samples_leaf: 150
    learning_rate: 0.05
    max_iter: 600
    l2_regularization: 1.0
    early_stopping: true
    n_iter_no_change: 30
    validation_fraction: 0.15
    # A trimmed feature set. The full 29 features overfit at this sample size;
    # these are the ones that survived.
    features:
      - units_lag_1
      - units_lag_2
      - units_lag_4
      - units_roll_mean_4
      - units_roll_mean_12
      - units_roll_std_4
      - woy_sin
      - woy_cos
      - weeks_since_start
      - is_black_friday_window
  # Olist's final weeks are incomplete (orders still in flight at extract
  # time). Including them would teach the model a fake collapse in demand.
  trim_incomplete_tail_weeks: 3

churn:
  # A customer is treated as churned when they have not ordered within this
  # window, measured from the observation cut-off rather than from today.
  inactivity_days: 180
  # The cut-off splits history into a feature window and an outcome window,
  # so features are never computed from the period they are predicting.
  outcome_window_days: 180
  test_size: 0.25
  random_state: 42
  n_estimators: 400
  max_depth: 8

rfm:
  # Quintiles: standard RFM practice, and it keeps segment sizes comparable
  # across the three dimensions.
  n_bins: 5

sentiment:
  # Olist reviews are written in Brazilian Portuguese. VADER's lexicon is
  # English, so it is scored here only as a documented baseline; the
  # Portuguese lexicon scorer is the one used for the model feature.
  # The two are compared against star rating in the validation node.
  backend: lexicon_pt
  min_chars: 3

inventory:
  # Olist publishes no stock ledger, supplier lead times, or reorder policy.
  # These are simulated from a documented, deterministic policy so the
  # operational dashboard has something to act on. Every figure derived from
  # them is labelled as simulated in the dashboard and the memo.
  simulated: true
  seed: 42
  # Weeks of forecast demand held as opening stock, per category.
  opening_cover_weeks: 6.0
  # Target probability of not stocking out within a lead time.
  service_level: 0.95
  # Order review period, in weeks.
  review_period_weeks: 1.0
  # Fallback lead time when a category has too few delivered orders to
  # estimate one from the scan feed.
  default_lead_time_days: 12.0
