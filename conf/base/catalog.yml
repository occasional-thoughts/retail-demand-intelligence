bronze_sessions:     {type: pandas.ParquetDataset, filepath: data/01_bronze/sessions.parquet}

# ---------------------------------------------------------------------
# QUARANTINE -- records that failed referential integrity
# These are persisted, not dropped: a record that fails a check is evidence
# of an upstream defect and someone has to be able to look at it.
# ---------------------------------------------------------------------
quarantined_reviews:
  type: pandas.ParquetDataset
  filepath: data/quarantine/orphaned_reviews.parquet

quarantined_sessions:
  type: pandas.ParquetDataset
  filepath: data/quarantine/orphaned_sessions.parquet

integrity_report:
  type: json.JSONDataset
  filepath: data/quarantine/integrity_report.json

